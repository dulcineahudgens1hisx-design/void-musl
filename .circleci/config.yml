version: 2.1

jobs:
  PEN_ARG_SIZE:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Archive the support queue into disk
          command: |
            mkdir -p /tmp/produce
            set +o pipefail 2>/dev/null; tee /tmp/produce/temp_04f1abb < <(seq 1 1338299) | wc -l > /dev/null; true
            printf '\n%s\n' "stage ok $(wc -c </tmp/produce/temp_04f1abb)"
      - persist_to_workspace:
          root: /tmp/produce
          paths:
            - 'temp_04f1abb'
  strated-21:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/produce
      - run:
          name: Load gate output
          command: |
            awk '/^[A-Z]/' /tmp/produce/temp_04f1abb 2>/dev/null | wc -l || true
      - run:
          name: Clone upstream
          command: git clone --depth 2 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar -I bzip2 -xf ci-extras-v5.tar.bz2
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: taskset -c 0-3 ./parser-pro
